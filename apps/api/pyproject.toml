[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "fastapi>=0.139.2",
    "httpx>=0.27.0",
    "lightgbm>=4.3.0",
    "neo4j>=6.2.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "passlib>=1.7.4",
    "psycopg[binary]>=3.3.4",
    "pycountry>=26.2.16",
    "pydantic-settings>=2.14.2",
    "pydantic[email]>=2.13.4",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "redis>=8.0.1",
    "requests>=2.34.2",
    "rq>=2.10.0",
    "scikit-learn>=1.4.0",
    "sqlalchemy>=2.0.51",
    "structlog>=26.1.0",
    "torch>=2.3.0",
    "uvicorn>=0.51.0",
    "wbdata>=1.1.0",
    "websockets>=16.1.1",
    "xgboost>=2.0.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
